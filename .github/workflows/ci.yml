name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # keep in lockstep with release.yml
          node-version: 24.18.0
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Update to stable when a new release > v1.7.1 is out
          # Anvil fork tests depend on https://github.com/foundry-rs/foundry/pull/14569
          version: nightly-7debd6d47628c5551837534aee507dbf552d5889
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: committed artifacts are fresh
        run: git diff --exit-code -- src/generated
      - name: packed tarball smoke test
        run: |
          pnpm pack --out /tmp/vts.tgz
          mkdir -p /tmp/vts-smoke && cd /tmp/vts-smoke
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          # viem and @types/node track package.json devDependency bumps.
          # typescript does NOT: it pins the oldest TypeScript a consumer may use, so this
          # proves our emitted .d.ts stays consumable below the version we build with.
          npm install --ignore-scripts /tmp/vts.tgz viem@2.54.1 typescript@5.9.3 @types/node@24.13.3 > /dev/null
          cat > smoke.ts <<'EOF'
          import { TxSimulator, OVERRIDE_TOKEN_AMOUNT } from "viem-tx-sim";
          import { createPublicClient, http } from "viem";
          const sim = TxSimulator.create({ client: createPublicClient({ transport: http("http://127.0.0.1:1") }) });
          const _check: typeof sim.simulate = sim.simulate;
          if (OVERRIDE_TOKEN_AMOUNT !== 10n ** 45n) throw new Error("constant");
          console.log("smoke ok", typeof _check);
          EOF
          # Resolve the published types both ways a consumer might: Node's own
          # resolver, and a bundler's. These two lines replace the attw check.
          npx tsc --strict --module node16 --moduleResolution node16 --target es2022 --skipLibCheck --noEmit smoke.ts
          npx tsc --strict --module preserve --moduleResolution bundler --target es2022 --skipLibCheck --noEmit smoke.ts
          node --input-type=module -e "import('viem-tx-sim').then(m => { if (!m.TxSimulator?.create) throw new Error('bad export'); console.log('runtime ok'); })"
